<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tally Screening</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-sans: "Outfit", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --color-paper: #f4f6fb;
      --color-card: #ffffff;
      --color-ink: #16213e;
      --color-muted: #6b7388;
      --color-rule: #e6e9f2;
      --color-met: #1f9d55;
      --color-part: #c98a12;
      --color-miss: #d1453b;
      --color-accent: #4145e8;
    }
    @custom-variant dark (&:where(.dark, .dark *));
    .dark {
      --color-paper: #0f1220;
      --color-card: #181c2e;
      --color-ink: #e8ebf7;
      --color-muted: #9aa2bd;
      --color-rule: #272c44;
      --color-met: #5fbf8a;
      --color-part: #e0a84a;
      --color-miss: #e2766d;
      --color-accent: #8b8ff5;
    }
    mark.ev { background: color-mix(in srgb, var(--color-met) 22%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
    kbd { @apply font-mono text-[11px] px-1.5 py-0.5 rounded border border-rule bg-paper text-muted; }
  </style>
</head>
<body class="bg-paper text-ink font-sans antialiased min-h-screen">
  <div class="flex min-h-screen">
    <aside class="hidden md:flex w-56 shrink-0 flex-col border-r border-rule bg-card px-3 py-4 sticky top-0 h-screen">
      <a href="#/" class="flex items-center gap-2 px-2 mb-6 font-semibold tracking-tight text-lg">
        <span class="inline-grid place-items-center w-8 h-8 rounded-lg bg-accent text-white font-semibold">T</span> Tally
      </a>
      <nav class="flex flex-col gap-1 text-sm">
        <a href="#/" data-nav="jobs" class="flex items-center gap-2.5 px-3 py-2 rounded-lg hover:bg-paper">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Roles</a>
        <a href="#/metrics" data-nav="metrics" class="flex items-center gap-2.5 px-3 py-2 rounded-lg hover:bg-paper">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg> Evaluation</a>
      </nav>
      <div class="mt-auto rounded-xl bg-paper p-3 text-xs text-muted leading-5"><b class="text-ink">Tally never rejects.</b><br>It shortlists, flags for review, or ranks low, and a person decides.</div>
      <button id="theme" class="mt-3 text-left px-3 py-2 rounded-lg hover:bg-paper text-muted text-sm" title="Toggle dark mode">◐ Theme</button>
    </aside>
    <div class="min-w-0 flex-1">
      <header class="md:hidden flex items-center gap-3 border-b border-rule bg-card px-4 h-12">
        <a href="#/" class="font-semibold">Tally</a><a href="#/" data-nav="jobs" class="text-sm ml-auto">Roles</a><a href="#/metrics" data-nav="metrics" class="text-sm">Evaluation</a>
      </header>
      <main id="view" class="max-w-6xl mx-auto px-5 py-6"></main>
    </div>
  </div>
  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 hidden px-4 py-2 rounded-lg bg-ink text-paper text-sm shadow-lg z-50"></div>
  <script src="/static/app.js"></script>
</body>
</html>
